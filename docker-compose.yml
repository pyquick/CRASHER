version: '3.8'

services:
  crash-report-server:
    build: .
    container_name: crash-report-server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - AUTH_TOKEN=
      - CORS_ORIGINS=*
      - MAX_LOG_SIZE=10485760
      - MAX_ATTACHMENT_SIZE=20971520
    volumes:
      - crash_data:/app/data
    restart: unless-stopped

volumes:
  crash_data:
