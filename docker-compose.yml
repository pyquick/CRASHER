services:
  crash-report-server:
    build: .
    container_name: crash-report-server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - API_REQUIRE_KEY=true
      # Direct port 8080 access is HTTP, so Secure cookies must be disabled by default.
      # Set COOKIE_SECURE=true only when clients connect through HTTPS.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - MAX_JSON_BODY_SIZE=12582912
      - MAX_LOG_SIZE=10485760
      - MAX_ATTACHMENT_SIZE=20971520
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:?AI_ENCRYPTION_KEY must be set}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - ALERT_ON_NEW_GROUP=${ALERT_ON_NEW_GROUP:-true}
      - ALERT_THRESHOLD_COUNT=${ALERT_THRESHOLD_COUNT:-10}
      - AI_DEEPSEEK_MODEL=${AI_DEEPSEEK_MODEL:-deepseek-chat}
      - AI_REQUEST_TIMEOUT_MS=${AI_REQUEST_TIMEOUT_MS:-60000}
      - AI_MESSAGE_MAX_LENGTH=${AI_MESSAGE_MAX_LENGTH:-10000}
      - AI_CONTEXT_MAX_CHARS=${AI_CONTEXT_MAX_CHARS:-120000}
      - AI_SOURCE_MAX_FILES=${AI_SOURCE_MAX_FILES:-20}
      - AI_HISTORY_MAX_CHARS=${AI_HISTORY_MAX_CHARS:-40000}
      - AI_RATE_LIMIT=${AI_RATE_LIMIT:-20}
      - AI_MAX_CONVERSATIONS=${AI_MAX_CONVERSATIONS:-50}
      - AI_MAX_MESSAGES_PER_CONVERSATION=${AI_MAX_MESSAGES_PER_CONVERSATION:-100}
      - AI_RETENTION_DAYS=${AI_RETENTION_DAYS:-30}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - crash_data:/app/data
    restart: unless-stopped

volumes:
  crash_data:
