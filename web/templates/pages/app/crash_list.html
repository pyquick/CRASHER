<div x-data="crashList">
  <!-- Filters -->
  <div class="bg-surface-900 rounded-xl p-4 mb-6 border border-gray-800">
    <div class="flex flex-wrap gap-3 items-end">
      <div class="flex-1 min-w-[200px]">
        <label class="block text-xs text-gray-500 mb-1">Search</label>
        <input type="text" x-model="filters.search"
               @keyup="clearTimeout(_t); _t = setTimeout(() => load(), 300)"
               placeholder="Search exception type or message..." class="fc w-full">
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">Project</label>
        <select x-model="filters.project_id" @change="load()" class="fc">
          <option value="">All</option>
          <option value="0">Unassigned</option>
          <template x-for="project in projects" :key="project.id">
            <option :value="String(project.id)" x-text="project.name"></option>
          </template>
        </select>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">Status</label>
        <select x-model="filters.status" @change="load()" class="fc">
          <option value="">All</option><option value="open">Open</option>
          <option value="resolved">Resolved</option><option value="ignored">Ignored</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">Platform</label>
        <select x-model="filters.platform" @change="load()" class="fc">
          <option value="">All</option>
          <template x-for="p in platforms" :key="p">
            <option :value="p" x-text="p"></option>
          </template>
        </select>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">Severity</label>
        <select x-model="filters.error_severity" @change="load()" class="fc">
          <option value="">All</option>
          <option value="warning">Warning</option><option value="error">Error</option>
          <option value="fatal">Fatal</option><option value="crash">Crash</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">Sort</label>
        <select x-model="filters.sort_by" @change="load()" class="fc">
          <option value="last_seen">Last Seen</option>
          <option value="total_count">Count</option>
          <option value="first_seen">First Seen</option>
        </select>
      </div>
      <button @click="load()" class="btn btn-blue">Filter</button>
    </div>
  </div>

  <!-- Error state -->
  <div x-show="error" class="bg-red-900/20 border border-red-800 text-red-400 rounded-lg p-4 mb-4">
    <span x-text="error"></span>
    <button class="btn btn-gray btn-sm ml-3" @click="load()">Retry</button>
  </div>

  <!-- Table -->
  <div class="bg-surface-900 rounded-xl border border-gray-800 overflow-hidden" :class="{ loading }">
    <table class="data-table" x-show="items.length > 0">
      <thead>
        <tr>
          <th>Exception</th>
          <th class="hidden md:table-cell">Project</th>
          <th class="hidden md:table-cell">Last Seen</th>
          <th class="hidden sm:table-cell">Severity</th>
          <th class="hidden sm:table-cell">Count</th>
          <th class="hidden sm:table-cell">Runtime</th>
          <th>Status</th>
          <th class="w-10"></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="item in items" :key="item.id">
          <tr class="hover:bg-surface-800 cursor-pointer transition-colors"
              @click="window.location.href = '/web/crashes/' + item.id">
            <td>
              <p class="font-medium text-gray-200" x-text="item.exception_type"></p>
              <p class="text-xs text-gray-500 mt-0.5 truncate max-w-xs" x-text="item.exception_message || 'No message'"></p>
            </td>
            <td class="hidden md:table-cell">
              <span class="pill" x-text="item.project_name || 'Unassigned'"></span>
            </td>
            <td class="hidden md:table-cell text-gray-400" x-text="formatDate(item.last_seen)"></td>
            <td class="hidden sm:table-cell">
              <span class="badge" :class="{
                'badge-open': item.error_severity === 'fatal' || item.error_severity === 'crash',
                'badge-resolved': item.error_severity === 'warning',
                'badge-ignored': item.error_severity === 'error' || !item.error_severity
              }" x-text="(item.error_severity || 'ERROR').toUpperCase()"></span>
            </td>
            <td class="hidden sm:table-cell">
              <span class="font-mono text-gray-300" x-text="item.total_count"></span>
            </td>
            <td class="hidden sm:table-cell">
              <span class="text-xs text-gray-400" x-text="item.runtime ? item.runtime.toUpperCase() : 'OTHER'"></span>
            </td>
            <td>
              <span class="badge" :class="{
                'badge-open': item.status === 'open',
                'badge-resolved': item.status === 'resolved',
                'badge-ignored': item.status === 'ignored'
              }" x-text="item.status"></span>
            </td>
            <td @click.stop>
              <a :href="'/api/v1/export/group/' + item.id" title="Export as .crashpkg"
                 class="text-green-400 hover:text-green-300 text-sm">&#x1F4E6;</a>
            </td>
          </tr>
        </template>
      </tbody>
    </table>

    <!-- Empty state -->
    <div x-show="items.length === 0 && !loading" class="text-center py-16 text-gray-500">
      <p class="text-lg mb-2">No crashes found</p>
      <p class="text-sm">Adjust your filters or wait for crash reports to arrive.</p>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="text-center py-16 text-gray-400">
      <div class="animate-spin inline-block w-5 h-5 border-2 border-blue-500 border-t-transparent rounded-full mr-2"></div>
      Loading...
    </div>
  </div>

  <!-- Pagination -->
  <div class="flex items-center justify-between mt-4 text-sm" x-show="total > 0">
    <p class="text-gray-500">
      Showing <span x-text="(page - 1) * page_size + 1" class="text-gray-300"></span>
      &ndash; <span x-text="Math.min(page * page_size, total)" class="text-gray-300"></span>
      of <span x-text="total" class="text-gray-300"></span>
    </p>
    <div class="flex gap-2">
      <button @click="goTo(page - 1)" :disabled="page <= 1" class="btn-page">&larr; Prev</button>
      <button @click="goTo(page + 1)" :disabled="page >= total_pages" class="btn-page">Next &rarr;</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('alpine:init', function () {
  Alpine.data('crashList', function () {
    return {
      items: [], total: 0, page: 1, page_size: 20, total_pages: 0,
      loading: false, error: '', projects: [], platforms: [], versions: [],
      filters: { search: '', project_id: '', status: '', platform: '', app_version: '', runtime: '', environment: '', error_severity: '', sort_by: 'last_seen' },
      _t: null,

      async init() {
        await Promise.all([this.loadProjects(), this.loadPlatforms(), this.loadVersions(), this.load()]);
      },

      async load() {
        this.loading = true; this.error = '';
        try {
          const p = new URLSearchParams({ page: this.page, page_size: this.page_size, sort_by: this.filters.sort_by });
          for (const [k, v] of Object.entries(this.filters)) {
            if (v && k !== 'sort_by') p.set(k, v);
          }
          const res = await fetch('/api/v1/crash-groups?' + p.toString());
          if (!res.ok) throw new Error('Server returned ' + res.status);
          const data = await res.json();
          this.items = data.items; this.total = data.total;
          this.page = data.page; this.total_pages = data.total_pages;
        } catch (err) {
          this.error = 'Failed to load crash data. Check your connection and try again.';
        }
        this.loading = false;
      },

      goTo: function (p) {
        if (p < 1 || p > this.total_pages) return;
        this.page = p; this.load();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      async loadProjects() {
        try { const r = await fetch('/api/v1/projects'); this.projects = await r.json(); } catch (e) {}
      },
      async loadPlatforms() {
        try { const r = await fetch('/api/v1/platforms'); this.platforms = await r.json(); } catch (e) {}
      },
      async loadVersions() {
        try { const r = await fetch('/api/v1/versions'); this.versions = await r.json(); } catch (e) {}
      },
    };
  });
});
</script>
