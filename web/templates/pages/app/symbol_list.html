<div x-data="symbolList">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-xl font-semibold">📦 Symbol Files</h1>
    <button @click="showUpload = !showUpload"
            class="btn btn-blue">
      + Upload Symbol
    </button>
  </div>

  <!-- Upload Form -->
  <div x-show="showUpload" class="bg-surface-900 rounded-xl p-5 mb-6 border border-gray-800 fade-in">
    <h2 class="text-sm font-semibold text-gray-300 mb-4">Upload Symbol File</h2>
    <form @submit.prevent="uploadSymbol" class="space-y-4">
      <div>
        <label class="block text-xs text-gray-500 mb-1">Platform</label>
        <select x-model="uploadForm.platform"
                class="fc w-full">
          <option value="Android">Android</option>
          <option value="iOS">iOS</option>
          <option value="Windows">Windows</option>
          <option value="Mac">Mac</option>
          <option value="WebGL">WebGL</option>
          <option value="Linux">Linux</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">Build GUID *</label>
        <input type="text" x-model="uploadForm.build_guid" required
               placeholder="Unity build GUID..."
               class="fc w-full">
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">Symbol Type</label>
        <select x-model="uploadForm.symbol_type"
                class="fc w-full">
          <option value="symbol_map">Unity SymbolMap</option>
          <option value="elf">Android ELF / Debug Symbol</option>
          <option value="dsym">iOS dSYM</option>
          <option value="unknown">Auto detect</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">Module Name (optional)</label>
        <input type="text" x-model="uploadForm.module_name" placeholder="libil2cpp.so"
               class="fc w-full">
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">Architecture (optional)</label>
        <input type="text" x-model="uploadForm.architecture" placeholder="arm64"
               class="fc w-full">
      </div>
      <div>
        <label class="block text-xs text-gray-500 mb-1">File *</label>
        <input type="file" @change="onFileSelected($event)"
               class="w-full text-sm text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-gray-700 file:text-gray-200 hover:file:bg-gray-600 transition-colors">
      </div>
      <div class="flex gap-3">
        <button type="submit" :disabled="uploading"
                class="btn btn-green">
          <span x-show="!uploading">Upload</span>
          <span x-show="uploading">Uploading...</span>
        </button>
        <button type="button" @click="showUpload = false"
                class="btn btn-gray">
          Cancel
        </button>
      </div>
      <p x-show="uploadMsg" class="text-sm" :class="uploadErr ? 'text-red-400' : 'text-green-400'" x-text="uploadMsg"></p>
    </form>
  </div>

  <!-- Filters -->
  <div class="flex gap-3 mb-4 items-end">
    <div>
      <label class="block text-xs text-gray-500 mb-1">Platform</label>
      <select x-model="filters.platform" @change="load()"
              class="fc">
        <option value="">All</option>
        <option value="Android">Android</option>
        <option value="iOS">iOS</option>
        <option value="Windows">Windows</option>
        <option value="Mac">Mac</option>
        <option value="WebGL">WebGL</option>
        <option value="Linux">Linux</option>
      </select>
    </div>
  </div>

  <!-- Error state -->
  <div x-show="error" class="bg-red-900/20 border border-red-800 text-red-400 rounded-lg p-4 mb-4">
    <span x-text="error"></span>
    <button class="btn btn-gray btn-sm ml-3" @click="load()">Retry</button>
  </div>

  <!-- Table -->
  <div class="bg-surface-900 rounded-xl border border-gray-800 overflow-hidden" :class="{ loading }">
    <div class="overflow-x-auto">
    <table class="data-table" x-show="items.length > 0">
      <thead>
        <tr>
          <th>Filename</th>
          <th>Platform</th>
          <th class="hidden sm:table-cell">Type</th>
          <th class="hidden sm:table-cell">Build GUID</th>
          <th class="hidden md:table-cell">Size</th>
          <th class="hidden md:table-cell">Uploaded</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="item in items" :key="item.id">
          <tr class="border-b border-gray-800/50 hover:bg-gray-800/30 transition-colors">
            <td class="px-4 py-3 font-medium text-gray-200 break-words" x-text="item.filename"></td>
            <td class="px-4 py-3 text-gray-400" x-text="item.platform"></td>
            <td class="px-4 py-3 text-gray-400 text-xs hidden sm:table-cell" x-text="item.symbol_type || 'unknown'"></td>
            <td class="px-4 py-3 text-gray-500 font-mono text-xs hidden sm:table-cell break-all" x-text="item.build_guid"></td>
            <td class="px-4 py-3 text-gray-400 hidden md:table-cell" x-text="formatSize(item.file_size)"></td>
            <td class="px-4 py-3 text-gray-400 hidden md:table-cell" x-text="formatDate(item.uploaded_at)"></td>
            <td class="px-4 py-3">
              <button @click="deleteSymbol(item.id)"
                      class="text-red-400 hover:text-red-300 text-xs transition-colors admin-only" style="display:none">Delete</button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
    </div>
    <div x-show="items.length === 0 && !loading" class="text-center py-16">
      <p class="text-gray-600">No symbol files uploaded yet</p>
    </div>
    <div x-show="loading" class="text-center py-16">
      <div class="inline-block w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('symbolList', () => ({
      items: [],
      page: 1,
      total: 0,
      loading: false, error: '',
      showUpload: false,
      uploading: false,
      uploadMsg: '',
      uploadErr: false,
      uploadForm: { platform: 'Android', build_guid: '', symbol_type: 'unknown', module_name: '', architecture: '', file: null },
      filters: { platform: '' },

      async init() {
        await this.load();
      },

      async load() {
        this.loading = true; this.error = '';
        try {
          const params = new URLSearchParams({ page: String(this.page) });
          if (this.filters.platform) params.set('platform', this.filters.platform);
          const res = await fetch('/api/v1/symbols?' + params.toString());
          const data = await res.json();
          this.items = data.items;
          this.total = data.total;
        } catch (err) {
          this.error = 'Failed to load symbols. Check your connection and try again.';
        }
        this.loading = false;
      },

      onFileSelected(event) {
        this.uploadForm.file = event.target.files[0];
      },

      async uploadSymbol() {
        if (!this.uploadForm.file || !this.uploadForm.build_guid) {
          this.uploadMsg = 'Please fill in all required fields';
          this.uploadErr = true;
          return;
        }
        this.uploading = true;
        this.uploadMsg = '';
        try {
          const formData = new FormData();
          formData.append('file', this.uploadForm.file);
          formData.append('platform', this.uploadForm.platform);
          formData.append('build_guid', this.uploadForm.build_guid);
          formData.append('symbol_type', this.uploadForm.symbol_type);
          formData.append('module_name', this.uploadForm.module_name);
          formData.append('architecture', this.uploadForm.architecture);

          const res = await fetch('/api/v1/symbols', { method: 'POST', body: formData });
          if (res.ok) {
            this.uploadMsg = 'Symbol uploaded successfully!';
            this.uploadErr = false;
            this.showUpload = false;
            this.uploadForm = { platform: 'Android', build_guid: '', symbol_type: 'unknown', module_name: '', architecture: '', file: null };
            await this.load();
          } else {
            const err = await res.json();
            this.uploadMsg = err.message || 'Upload failed';
            this.uploadErr = true;
          }
        } catch (err) {
          this.uploadMsg = 'Network error';
          this.uploadErr = true;
        }
        this.uploading = false;
      },

      async deleteSymbol(id) {
        if (!await Modal.confirm('Delete Symbol', 'Delete this symbol file?', 'Delete')) return;
        try {
          const res = await fetch('/api/v1/symbols/' + id, { method: 'DELETE' });
          if (res.ok) {
            await this.load();
          }
        } catch (err) {
          console.error('Failed to delete:', err);
        }
      },

    }));
  });
</script>
