<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Crash Report Server</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 700: '#334155', 800: '#1e293b', 900: '#0f172a', 950: '#020617' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-surface-950 text-gray-100 min-h-screen">

<div x-data="forgotForm" class="flex items-center justify-center min-h-screen">
  <div class="w-full max-w-sm px-4">
    <div class="bg-surface-900 rounded-xl p-8 border border-gray-800">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold">🔑 Password Reset</h1>
        <p class="text-xs text-gray-500 mt-1">Forgot your password? We'll help you reset it.</p>
      </div>

      <!-- Step 1: Request reset token -->
      <div x-show="step === 1">
        <p class="text-sm text-gray-400 mb-4">Enter your username and an administrator will provide a reset code.</p>
        <form @submit.prevent="requestReset" class="space-y-4">
          <div>
            <label class="block text-xs text-gray-500 mb-1">Username</label>
            <input type="text" x-model="username" required
                   class="w-full bg-surface-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500"
                   placeholder="Enter your username">
          </div>

          <p x-show="step1Msg" class="text-sm text-blue-400 text-center" x-text="step1Msg"></p>
          <p x-show="step1Error" class="text-sm text-red-400 text-center" x-text="step1Error"></p>

          <button type="submit" :disabled="loading"
                  class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 rounded-lg text-sm font-medium transition-colors">
            <span x-show="!loading">Request Reset</span>
            <span x-show="loading" class="inline-flex items-center justify-center gap-2">
              <span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
              Requesting...
            </span>
          </button>
        </form>
      </div>

      <!-- Step 2: Enter reset token and new password -->
      <div x-show="step === 2" x-cloak>
        <p class="text-sm text-gray-400 mb-4">Enter the reset code you received and choose a new password.</p>
        <form @submit.prevent="resetPassword" class="space-y-4">
          <div>
            <label class="block text-xs text-gray-500 mb-1">Reset Code</label>
            <input type="text" x-model="resetToken" required
                   class="w-full bg-surface-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500 font-mono"
                   placeholder="Enter the reset code">
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">New Password</label>
            <input type="password" x-model="newPassword" required
                   class="w-full bg-surface-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500"
                   placeholder="Enter new password">
            <p class="text-xs text-gray-600 mt-1">Min 12 characters, uppercase, lowercase, number, and special character.</p>
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">Confirm Password</label>
            <input type="password" x-model="confirmPassword" required
                   class="w-full bg-surface-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500"
                   placeholder="Confirm new password">
          </div>

          <p x-show="step2Error" class="text-sm text-red-400 text-center" x-text="step2Error"></p>
          <p x-show="step2Msg" class="text-sm text-green-400 text-center" x-text="step2Msg"></p>

          <button type="submit" :disabled="loading"
                  class="w-full py-2.5 bg-green-600 hover:bg-green-700 disabled:opacity-50 rounded-lg text-sm font-medium transition-colors">
            <span x-show="!loading">Reset Password</span>
            <span x-show="loading" class="inline-flex items-center justify-center gap-2">
              <span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
              Resetting...
            </span>
          </button>
        </form>
      </div>

      <div class="mt-4 text-center">
        <a href="/web/login" class="text-xs text-gray-500 hover:text-blue-400 transition-colors">Back to Login</a>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('forgotForm', () => ({
      step: 1,
      username: '',
      resetToken: '',
      newPassword: '',
      confirmPassword: '',
      loading: false,
      step1Msg: '',
      step1Error: '',
      step2Msg: '',
      step2Error: '',

      async requestReset() {
        this.step1Error = '';
        this.step1Msg = '';
        this.loading = true;
        try {
          const res = await fetch('/api/v1/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: this.username }),
          });
          const data = await res.json();
          if (res.ok && data.success) {
            // If a reset_token was returned, auto-proceed to step 2
            if (data.reset_token) {
              this.resetToken = data.reset_token;
              this.step1Msg = 'A reset code has been generated. Continue below.';
              this.step = 2;
            } else {
              this.step1Msg = data.message || 'If the account exists, ask an administrator for help.';
            }
          } else {
            this.step1Error = data.message || 'Request failed';
          }
        } catch (err) {
          this.step1Error = 'Network error';
        }
        this.loading = false;
      },

      async resetPassword() {
        this.step2Error = '';
        this.step2Msg = '';
        if (this.newPassword !== this.confirmPassword) {
          this.step2Error = 'Passwords do not match';
          return;
        }
        if (this.newPassword.length < 12) {
          this.step2Error = 'Password must be at least 12 characters';
          return;
        }
        this.loading = true;
        try {
          const res = await fetch('/api/v1/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reset_token: this.resetToken, new_password: this.newPassword }),
          });
          const data = await res.json();
          if (res.ok && data.success) {
            this.step2Msg = 'Password reset successfully! Redirecting to login...';
            setTimeout(() => { window.location.href = '/web/login'; }, 2000);
          } else {
            this.step2Error = data.message || 'Reset failed';
          }
        } catch (err) {
          this.step2Error = 'Network error';
        }
        this.loading = false;
      }
    }));
  });
</script>
</body>
</html>
