<!DOCTYPE html>
<html lang="zh-CN">
<head>
{{HEAD}}
</head>
<body class="bg-surface-950 text-gray-100 min-h-screen" x-data="{ sidebarOpen: false }">
  <!-- Mobile sidebar overlay -->
  <div x-show="sidebarOpen" class="fixed inset-0 bg-black/60 z-40 lg:hidden" @click="sidebarOpen = false" x-transition.opacity></div>

  <!-- Sidebar -->
  <aside class="fixed top-0 left-0 h-full w-60 bg-surface-900 border-r border-gray-800 z-50 transform transition-transform duration-200 lg:translate-x-0"
         :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'">
    <div class="p-5 border-b border-gray-800">
      <h1 class="text-lg font-bold tracking-tight">💥 Crash Reporter</h1>
      <p class="text-xs text-gray-500 mt-1">Cross-Platform Error Tracking</p>
    </div>
    <nav class="p-3 space-y-1">
      <a href="/web/" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium {{CONTENT === '/web/' ? 'active' : 'text-gray-400'}} ua-hide">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2" stroke-width="1.5"/><rect x="2" y="14" width="20" height="8" rx="2" stroke-width="1.5"/></svg>
        Dashboard
      </a>
      <a href="/web/crashes" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium {{CONTENT === '/web/crashes' ? 'active' : 'text-gray-400'}} viewer-hide ua-hide">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="1.5"/><path d="M12 6v6l4 2" stroke-width="1.5" stroke-linecap="round"/></svg>
        Crashes
      </a>
      <a href="/web/feedback" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium {{CONTENT === '/web/feedback' ? 'active' : 'text-gray-400'}} viewer-hide ua-hide">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.86 9.86 0 01-4.255-.949L3 20l1.529-3.057A7.48 7.48 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Player Feedback
      </a>
      <a href="/web/symbols" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium {{CONTENT === '/web/symbols' ? 'active' : 'text-gray-400'}} viewer-hide ua-hide">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" stroke-width="1.5"/></svg>
        Symbols
      </a>
      <a href="/web/accounts" id="accounts-link" style="display:none" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium {{CONTENT === '/web/accounts' ? 'active' : 'text-gray-400'}} ua-hide">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zm7 9a7 7 0 00-14 0" stroke-width="1.5" stroke-linecap="round"/></svg>
        Accounts
      </a>
      <a href="/web/containers" id="containers-link" style="display:none" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium {{CONTENT === '/web/containers' ? 'active' : 'text-gray-400'}}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Containers
      </a>
      <a href="/web/api-doc" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-width="1.5"/></svg>
        API Docs
      </a>
    </nav>
  </aside>

  <!-- Main content -->
  <div class="lg:ml-60 min-h-screen">
    <!-- Top bar -->
    <header class="sticky top-0 z-30 bg-surface-900/80 backdrop-blur border-b border-gray-800 px-4 py-3 flex items-center gap-4">
      <button class="lg:hidden p-1.5 rounded-lg hover:bg-gray-800" @click="sidebarOpen = !sidebarOpen">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <span class="text-sm text-gray-400 flex-1" id="page-subtitle">{{SUBTITLE}}</span>
      <span class="text-xs text-gray-500 mr-2" id="container-badge" style="display:none"></span>
      <span class="text-xs text-gray-500" id="current-user"></span>
      <button type="button" onclick="secureLogout()"
              class="text-xs text-gray-500 hover:text-gray-300 transition-colors px-3 py-1.5 rounded-lg hover:bg-gray-800">
        Logout
      </button>
    </header>

    <main class="p-6">
      {{BODY}}
    </main>
  </div>

  {{INCLUDE:ai_chat.html}}

  <!-- Global Modal -->
  <div id="global-modal" style="display:none" class="fixed inset-0 z-[70] flex items-center justify-center bg-black/60 backdrop-blur-sm" onclick="if(event.target===this) Modal._cancel()">
    <div class="bg-surface-900 border border-gray-700 rounded-xl p-6 w-full max-w-sm mx-4 shadow-2xl" onclick="event.stopPropagation()">
      <h3 id="modal-title" class="text-sm font-semibold mb-3"></h3>
      <p id="modal-message" class="text-sm text-gray-400 mb-4"></p>
      <input id="modal-input" type="text" class="fc w-full mb-4" style="display:none" onkeyup="if(event.key==='Enter') Modal._confirm()">
      <div class="flex justify-end gap-3">
        <button id="modal-cancel-btn" class="btn bg-gray-700 hover:bg-gray-600 text-sm" style="display:none" onclick="Modal._cancel()">Cancel</button>
        <button id="modal-ok-btn" class="btn btn-blue text-sm" onclick="Modal._confirm()">OK</button>
      </div>
    </div>
  </div>

  <script src="/web/static/js/app.js"></script>
  <script src="/web/static/js/table.js"></script>
  <script src="/web/static/js/auth.js"></script>
</body>
</html>
