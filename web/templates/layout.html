<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 700: '#334155', 800: '#1e293b', 900: '#0f172a', 950: '#020617' }
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .stack-trace { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 0.8125rem; }
    pre { white-space: pre-wrap; word-break: break-all; }
    .nav-link { transition: all 0.15s ease; }
    .nav-link:hover { background-color: rgba(255,255,255,0.08); }
    .nav-link.active { background-color: rgba(59,130,246,0.15); color: #60a5fa; }
    .badge { display: inline-flex; align-items: center; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
    .badge-open { background-color: rgba(239,68,68,0.15); color: #f87171; }
    .badge-resolved { background-color: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-ignored { background-color: rgba(148,163,184,0.15); color: #94a3b8; }
    .stat-card { transition: transform 0.15s ease; }
    .stat-card:hover { transform: translateY(-2px); }
    .loading { opacity: 0.5; pointer-events: none; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Shared Form Controls ── */
    .fc {
      background-color: #1e293b;
      border: 1px solid #374151;
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      line-height: 1.25rem;
      color: #e5e7eb;
      transition: border-color 0.15s ease;
    }
    .fc::placeholder { color: #4b5563; }
    .fc:focus { outline: none; border-color: #3b82f6; }
    .fc-sm { padding: 0.25rem 0.5rem; }

    /* ── Shared Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.25rem;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sm { padding: 0.375rem 0.75rem; font-size: 0.75rem; }
    .btn-blue { background-color: #2563eb; color: #fff; }
    .btn-blue:hover:not(:disabled) { background-color: #1d4ed8; }
    .btn-green { background-color: #16a34a; color: #fff; }
    .btn-green:hover:not(:disabled) { background-color: #15803d; }
    .btn-red {
      background-color: rgba(220, 38, 38, 0.2);
      color: #f87171;
      border: 1px solid #991b1b;
    }
    .btn-red:hover:not(:disabled) { background-color: rgba(220, 38, 38, 0.4); }
    .btn-gray { background-color: #374151; color: #e5e7eb; }
    .btn-gray:hover:not(:disabled) { background-color: #4b5563; }

    /* ── Pagination buttons ── */
    .btn-page {
      display: inline-flex;
      align-items: center;
      border-radius: 0.5rem;
      padding: 0.375rem 0.75rem;
      background-color: #1e293b;
      border: 1px solid #374151;
      transition: background-color 0.15s ease;
    }
    .btn-page:hover:not(:disabled) { background-color: #374151; }
    .btn-page:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── Shared Pill ── */
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 0.125rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1.25rem;
    }

    /* ── Crash File Tree ── */
    .crash-file-tree {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 0.8125rem;
    }
    .tree-list {
      min-width: max-content;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .tree-list .tree-list {
      margin-left: 13px;
      padding-left: 18px;
      border-left: 1px solid #374151;
    }
    .tree-list.collapsed { display: none; }
    .tree-node { position: relative; }
    .tree-list .tree-list > .tree-node::before {
      content: '';
      position: absolute;
      top: 16px;
      left: -18px;
      width: 14px;
      border-top: 1px solid #374151;
    }
    .tree-row {
      display: grid;
      grid-template-columns: 16px 34px minmax(8rem, auto) auto;
      align-items: center;
      gap: 6px;
      width: 100%;
      min-height: 32px;
      padding: 4px 8px;
      border-radius: 6px;
      color: #d1d5db;
      text-align: left;
      white-space: nowrap;
      transition: background-color 0.12s ease;
    }
    .tree-row:hover, .tree-row:focus-visible {
      background: rgba(255,255,255,0.06);
      outline: none;
    }
    .tree-dir { cursor: pointer; }
    .tree-chevron {
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 6px solid #9ca3af;
      transition: transform 0.12s ease;
    }
    .tree-chevron.expanded { transform: rotate(90deg); }
    .tree-file-spacer { width: 6px; }
    .tree-kind {
      display: inline-flex;
      justify-content: center;
      min-width: 34px;
      padding: 1px 4px;
      border-radius: 4px;
      background: #1f2937;
      color: #9ca3af;
      font-size: 0.625rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .tree-kind-dir { background: rgba(37,99,235,0.16); color: #93c5fd; }
    .tree-name { overflow: hidden; text-overflow: ellipsis; }
    .tree-dir .tree-name { color: #e5e7eb; font-weight: 600; }
    .tree-meta { margin-left: 8px; color: #6b7280; font-size: 0.6875rem; }
    .tree-severity-red { color: #fca5a5; background: rgba(127,29,29,0.18); }
    .tree-severity-orange { color: #fdba74; }
    .tree-severity-yellow { color: #fde68a; }
    .tree-severity-gray { color: #9ca3af; }
    .tree-crash-tag {
      margin-left: 8px;
      padding: 1px 6px;
      border: 1px solid rgba(248,113,113,0.35);
      border-radius: 9999px;
      background: rgba(127,29,29,0.25);
      color: #fca5a5;
      font-size: 0.6875rem;
      font-weight: 600;
    }
    .tree-line-num { margin-left: 6px; color: #6b7280; font-size: 0.6875rem; }
  </style>
</head>
<body class="bg-surface-950 text-gray-100 min-h-screen" x-data="{ sidebarOpen: false }">
  <!-- Mobile sidebar overlay -->
  <div x-show="sidebarOpen" class="fixed inset-0 bg-black/60 z-40 lg:hidden" @click="sidebarOpen = false" x-transition.opacity></div>

  <!-- Sidebar -->
  <aside class="fixed top-0 left-0 h-full w-60 bg-surface-900 border-r border-gray-800 z-50 transform transition-transform duration-200 lg:translate-x-0"
         :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'">
    <div class="p-5 border-b border-gray-800">
      <h1 class="text-lg font-bold tracking-tight">💥 Crash Reporter</h1>
      <p class="text-xs text-gray-500 mt-1">Cross-Platform Error Tracking</p>
    </div>
    <nav class="p-3 space-y-1">
      <a href="/web/" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium {{CONTENT === '/web/' ? 'active' : 'text-gray-400'}} ua-hide">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2" stroke-width="1.5"/><rect x="2" y="14" width="20" height="8" rx="2" stroke-width="1.5"/></svg>
        Dashboard
      </a>
      <a href="/web/crashes" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium {{CONTENT === '/web/crashes' ? 'active' : 'text-gray-400'}} viewer-hide ua-hide">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="1.5"/><path d="M12 6v6l4 2" stroke-width="1.5" stroke-linecap="round"/></svg>
        Crashes
      </a>
      <a href="/web/feedback" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium {{CONTENT === '/web/feedback' ? 'active' : 'text-gray-400'}} viewer-hide ua-hide">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.86 9.86 0 01-4.255-.949L3 20l1.529-3.057A7.48 7.48 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Player Feedback
      </a>
      <a href="/web/symbols" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium {{CONTENT === '/web/symbols' ? 'active' : 'text-gray-400'}} viewer-hide ua-hide">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" stroke-width="1.5"/></svg>
        Symbols
      </a>
      <a href="/web/accounts" id="accounts-link" style="display:none" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium {{CONTENT === '/web/accounts' ? 'active' : 'text-gray-400'}} ua-hide">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zm7 9a7 7 0 00-14 0" stroke-width="1.5" stroke-linecap="round"/></svg>
        Accounts
      </a>
      <a href="/web/containers" id="containers-link" style="display:none" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium {{CONTENT === '/web/containers' ? 'active' : 'text-gray-400'}}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Containers
      </a>
      <a href="/web/api-doc" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-width="1.5"/></svg>
        API Docs
      </a>
    </nav>
  </aside>

  <!-- Main content -->
  <div class="lg:ml-60 min-h-screen">
    <!-- Top bar -->
    <header class="sticky top-0 z-30 bg-surface-900/80 backdrop-blur border-b border-gray-800 px-4 py-3 flex items-center gap-4">
      <button class="lg:hidden p-1.5 rounded-lg hover:bg-gray-800" @click="sidebarOpen = !sidebarOpen">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <span class="text-sm text-gray-400 flex-1" id="page-subtitle">{{SUBTITLE}}</span>
      <span class="text-xs text-gray-500 mr-2" id="container-badge" style="display:none"></span>
      <span class="text-xs text-gray-500" id="current-user"></span>
      <button type="button" onclick="secureLogout()"
              class="text-xs text-gray-500 hover:text-gray-300 transition-colors px-3 py-1.5 rounded-lg hover:bg-gray-800">
        Logout
      </button>
    </header>

    <main class="p-6">
      {{BODY}}
    </main>
  </div>

  <!-- Global Modal -->
  <div id="global-modal" style="display:none" class="fixed inset-0 z-[70] flex items-center justify-center bg-black/60 backdrop-blur-sm" onclick="if(event.target===this) Modal._cancel()">
    <div class="bg-surface-900 border border-gray-700 rounded-xl p-6 w-full max-w-sm mx-4 shadow-2xl" onclick="event.stopPropagation()">
      <h3 id="modal-title" class="text-sm font-semibold mb-3"></h3>
      <p id="modal-message" class="text-sm text-gray-400 mb-4"></p>
      <input id="modal-input" type="text" class="fc w-full mb-4" style="display:none" onkeyup="if(event.key==='Enter') Modal._confirm()">
      <div class="flex justify-end gap-3">
        <button id="modal-cancel-btn" class="btn bg-gray-700 hover:bg-gray-600 text-sm" style="display:none" onclick="Modal._cancel()">Cancel</button>
        <button id="modal-ok-btn" class="btn btn-blue text-sm" onclick="Modal._confirm()">OK</button>
      </div>
    </div>
  </div>

  <script>
    window.Modal = (() => {
      let resolve = null;
      const el = {
        root: () => document.getElementById('global-modal'),
        title: () => document.getElementById('modal-title'),
        msg: () => document.getElementById('modal-message'),
        input: () => document.getElementById('modal-input'),
        ok: () => document.getElementById('modal-ok-btn'),
        cancel: () => document.getElementById('modal-cancel-btn'),
      };
      function show(title, message, type, opts) {
        return new Promise(r => {
          resolve = r;
          el.title().textContent = title;
          el.msg().textContent = message || '';
          el.msg().style.display = message ? '' : 'none';
          el.ok().textContent = (opts && opts.okLabel) || 'OK';
          if (type === 'input') {
            el.input().style.display = '';
            el.input().value = '';
            el.input().type = (opts && opts.inputType) || 'text';
            el.input().placeholder = (opts && opts.placeholder) || '';
            el.input().focus();
          } else {
            el.input().style.display = 'none';
          }
          el.cancel().style.display = type !== 'info' ? '' : 'none';
          el.root().style.display = '';
        });
      }
      const api = {
        confirm(title, message, okLabel) { return show(title, message, 'confirm', { okLabel }); },
        prompt(title, message, inputType, placeholder, okLabel) { return show(title, message, 'input', { inputType, placeholder, okLabel }); },
        alert(title, message) { return show(title, message, 'info', {}); },
      };
      api._confirm = function () {
        const result = el.input().style.display === 'none' ? true : el.input().value;
        el.root().style.display = 'none';
        if (resolve) { resolve(result); resolve = null; }
      };
      api._cancel = function () {
        el.root().style.display = 'none';
        if (resolve) { resolve(null); resolve = null; }
      };
      return api;
    })();
    function readCookie(name) {
      const prefix = encodeURIComponent(name) + '=';
      const item = document.cookie.split('; ').find(value => value.startsWith(prefix));
      return item ? decodeURIComponent(item.substring(prefix.length)) : '';
    }

    function formatDate(d) { if (!d) return '-'; return new Date(d).toLocaleString(); }
    function formatSize(bytes) {
      if (!bytes) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      let i = 0, size = bytes;
      while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
      return size.toFixed(1) + ' ' + units[i];
    }

    const originalFetch = window.fetch.bind(window);
    window.fetch = (input, init = {}) => {
      const method = String(init.method || 'GET').toUpperCase();
      if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
        const headers = new Headers(init.headers || {});
        headers.set('X-CSRF-Token', readCookie('csrf_token'));
        init.headers = headers;
      }
      return originalFetch(input, init);
    };

    async function secureLogout() {
      await window.fetch('/web/logout', { method: 'POST' });
      window.location.href = '/web/login';
    }

    originalFetch('/api/v1/auth/me').then(response => response.json()).then(data => {
      if (!data.user) return;
      const el = document.getElementById('current-user');
      el.textContent = data.user.username + ' · ' + data.user.role;
      if (data.user.role === 'ultraadmin') {
        // UltraAdmin only sees container management
        document.getElementById('containers-link').style.display = '';
        document.querySelectorAll('.admin-only').forEach(n => { n.style.display = ''; });
        // Hide dashboard, crashes, feedback, accounts, symbols for UltraAdmin
        document.querySelectorAll('.ua-hide').forEach(n => n.remove());
        const badge = document.getElementById('container-badge');
        badge.textContent = 'UltraAdmin · All Containers';
        badge.style.display = '';
        badge.className = 'text-xs text-purple-400 mr-2 px-2 py-0.5 rounded bg-purple-900/30 border border-purple-700/30';
        // Redirect UltraAdmin to containers page if on dashboard
        if (window.location.pathname === '/web/' || window.location.pathname === '/web') {
          window.location.replace('/web/containers');
        }
      } else {
        document.getElementById('containers-link').remove();
        if (data.user.role === 'admin' || data.user.role === 'operator') {
          document.getElementById('accounts-link').style.display = '';
        }
        if (data.user.role === 'admin') {
          document.querySelectorAll('.admin-only').forEach(n => { n.style.display = ''; });
        }
        if (data.user.role !== 'admin' && data.user.role !== 'operator') {
          document.querySelectorAll('.viewer-hide').forEach(n => n.remove());
        }
        if (data.container_name) {
          const badge = document.getElementById('container-badge');
          badge.textContent = 'Container: ' + data.container_name;
          badge.style.display = '';
          badge.className = 'text-xs text-blue-400 mr-2';
        }
      }
    }).catch(() => {});
  </script>
</body>
</html>
