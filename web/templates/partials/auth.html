<!-- ── Email verification widget (login identity check / accounts add & verify) ── -->
<div x-data="{ e: $store.authSteps.email, s: $store.authSteps }" x-show="e.open" x-cloak
     class="fixed inset-0 z-[70] flex items-center justify-center bg-black/60 backdrop-blur-sm">
  <div class="bg-surface-900 border border-gray-700 rounded-xl p-6 w-full max-w-sm mx-4 shadow-2xl">
    <h3 class="text-sm font-semibold mb-1" x-text="e.title"></h3>
    <p x-show="e.step === 'input'" class="text-xs text-gray-500 mb-4">A verification code will be sent to this address.</p>
    <p x-show="e.step === 'code'" class="text-xs text-gray-500 mb-4" x-text="e.message || 'Enter the 6-digit verification code.'"></p>

    <!-- Add mode: email input step -->
    <div x-show="e.mode === 'add' && e.step === 'input'" class="space-y-3">
      <input type="email" x-model="e.emailInput" placeholder="your@email.com" autocomplete="off"
             class="fc w-full" @keyup.enter="s.emailSubmit()">
      <p x-show="e.error" class="text-sm text-red-400" x-text="e.error"></p>
      <div class="flex justify-end gap-3">
        <button type="button" class="btn btn-gray" @click="s.closeEmail()" :disabled="e.loading">Cancel</button>
        <button type="button" class="btn btn-blue" @click="s.emailSubmit()" :disabled="e.loading">
          <span x-show="!e.loading">Send Code</span>
          <span x-show="e.loading">Sending...</span>
        </button>
      </div>
    </div>

    <!-- Code entry step (all modes) -->
    <div x-show="e.step === 'code'" class="space-y-3">
      <input type="text" x-model="e.code" maxlength="6" inputmode="numeric" autocomplete="one-time-code"
             placeholder="000000" class="fc w-full text-center font-mono tracking-[0.3em]"
             @keyup.enter="s.emailSubmit()">
      <p x-show="e.error" class="text-sm text-red-400" x-text="e.error"></p>
      <div class="flex justify-end gap-3">
        <button type="button" class="btn btn-gray" @click="s.closeEmail()" :disabled="e.loading"
                x-text="e.mode === 'login' ? 'Back to Login' : 'Cancel'"></button>
        <button type="button" class="btn btn-gray" @click="s.emailResend()" :disabled="e.loading || e.resendCooldown > 0">
          <span x-show="e.resendCooldown === 0">Resend</span>
          <span x-show="e.resendCooldown > 0" x-text="'Resend (' + e.resendCooldown + 's)'"></span>
        </button>
        <button type="button" class="btn btn-blue" @click="s.emailSubmit()" :disabled="e.loading">
          <span x-show="!e.loading" x-text="e.mode === 'login' ? 'Verify' : 'Confirm'"></span>
          <span x-show="e.loading">Verifying...</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ── 2FA widget (login TOTP step / operation 2FA challenge) ── -->
<div x-data="{ t: $store.authSteps.twoFactor, s: $store.authSteps }" x-show="t.open" x-cloak
     class="fixed inset-0 z-[70] flex items-center justify-center bg-black/60 backdrop-blur-sm">
  <div class="bg-surface-900 border border-gray-700 rounded-xl p-6 w-full max-w-sm mx-4 shadow-2xl">
    <h3 class="text-sm font-semibold mb-1">Two-Factor Authentication</h3>
    <p class="text-xs text-gray-500 mb-4"
       x-text="t.method === 'totp' ? 'Enter the 6-digit code from your authenticator app.' : (t.message || 'A verification code has been sent to ' + t.hint + '.')"></p>
    <div class="space-y-3">
      <input type="text" x-model="t.code" maxlength="6" inputmode="numeric" autocomplete="one-time-code"
             placeholder="000000" class="fc w-full text-center font-mono tracking-[0.3em]"
             @keyup.enter="s.twoFactorSubmit()">
      <p x-show="t.error" class="text-sm text-red-400" x-text="t.error"></p>
      <div class="flex justify-end gap-3">
        <button type="button" class="btn btn-gray" @click="s.close2FA()" :disabled="t.loading"
                x-text="t.context === 'login' ? 'Back to Login' : 'Cancel'"></button>
        <button type="button" class="btn btn-gray" x-show="t.method !== 'totp'" @click="s.twoFactorResend()"
                :disabled="t.loading || t.resendCooldown > 0">
          <span x-show="t.resendCooldown === 0">Resend</span>
          <span x-show="t.resendCooldown > 0" x-text="'Resend (' + t.resendCooldown + 's)'"></span>
        </button>
        <button type="button" class="btn btn-blue" @click="s.twoFactorSubmit()" :disabled="t.loading">
          <span x-show="!t.loading">Verify</span>
          <span x-show="t.loading">Verifying...</span>
        </button>
      </div>
    </div>
  </div>
</div>
