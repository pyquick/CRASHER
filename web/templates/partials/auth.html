<!-- ── Unified verification window (operation 2FA · login email/TOTP · email manage) ── -->
<div x-data="{ v: $store.authSteps.verify, s: $store.authSteps }" x-show="v.open" x-cloak
     class="fixed inset-0 z-[70] flex items-center justify-center bg-black/60 backdrop-blur-sm">
  <div class="bg-surface-900 border border-gray-700 rounded-xl p-6 w-full max-w-sm mx-4 shadow-2xl">
    <h3 class="text-sm font-semibold mb-1" x-text="v.context === 'login-email' || v.context === 'email-add' || v.context === 'email-verify' ? 'Email Verification' : 'Two-Factor Authentication'"></h3>

    <!-- Method tabs: email/SMS for operations; hidden for login TOTP -->
    <div x-show="v.context !== 'login-2fa' && v.tabs.length > 1" class="flex gap-1 mb-3">
      <template x-for="m in v.tabs" :key="m">
        <button type="button" class="flex-1 rounded-lg border px-3 py-1.5 text-xs font-medium transition-colors"
                :class="v.tab === m
                  ? 'bg-blue-600/20 border-blue-700/60 text-blue-300'
                  : 'border-gray-700 text-gray-400 hover:text-gray-200 hover:border-gray-600'"
                :aria-selected="String(v.tab === m)" role="tab" @click="s.verifySelect(m)">
          <span x-text="m === 'email' ? 'Email 邮箱' : 'SMS 短信'"></span>
        </button>
      </template>
    </div>

    <!-- Email add: enter the new address first -->
    <div x-show="v.context === 'email-add' && v.step === 'input'" class="space-y-3 mb-4">
      <input type="email" x-model="v.emailInput" placeholder="your@email.com" autocomplete="off"
             class="fc w-full" @keyup.enter="s.verifySend()">
    </div>

    <p x-show="v.context !== 'email-add' || v.step === 'code'" class="text-xs text-gray-500 mb-4" x-text="v.context === 'login-2fa'
      ? 'Enter the 6-digit code from your authenticator app.'
      : v.sent
        ? (v.message || (v.tab === 'sms' ? 'Verification code sent to ' + (v.hint || 'your phone') + '.' : 'Verification code sent to ' + (v.hint || 'your email') + '.'))
        : (v.message || (v.tab === 'sms' ? 'A verification code will be sent to your verified phone number. Click send code to request it.' : 'A verification code will be sent to your verified email address. Click send code to request it.'))"></p>

    <div class="space-y-3">
      <input type="text" x-model="v.code" maxlength="6" inputmode="numeric" autocomplete="one-time-code"
             placeholder="000000" class="fc w-full text-center font-mono tracking-[0.3em]"
             @keyup.enter="s.verifySubmit()">
      <p x-show="v.error" class="text-sm text-red-400" x-text="v.error"></p>
      <div class="flex justify-end gap-3">
        <button type="button" class="btn btn-gray" @click="s.closeVerify()" :disabled="v.loading"
                x-text="v.context === 'login-2fa' ? 'Back to Login' : 'Cancel'"></button>
        <button type="button" class="btn btn-gray" x-show="v.context !== 'login-2fa'" @click="s.verifySend()"
                :disabled="v.loading || v.resendCooldown > 0">
          <span x-show="v.resendCooldown > 0" x-text="'Resend (' + v.resendCooldown + 's)'"></span>
          <span x-show="v.resendCooldown === 0" x-text="v.context === 'email-add' && v.step === 'input' ? 'Send code' : (v.sent ? 'Resend' : 'Send code')"></span>
        </button>
        <button type="button" class="btn btn-blue" @click="s.verifySubmit()" :disabled="v.loading">
          <span x-show="!v.loading">Verify</span>
          <span x-show="v.loading">Verifying...</span>
        </button>
      </div>
    </div>
  </div>
</div>
