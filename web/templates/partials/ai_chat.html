<div x-data="aiChat" x-cloak class="ai-chat-host">
  <button x-show="available && !open" @click="openPanel" type="button" class="ai-chat-launcher" aria-label="Open AI crash assistant">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 3a8 8 0 0 0-8 8v2a3 3 0 0 0 3 3h1v-5H5a7 7 0 0 1 14 0h-3v5h1a3 3 0 0 0 3-3v-2a8 8 0 0 0-8-8Z" stroke-width="1.5"/><path d="M8 19c1.2 1.3 2.5 2 4 2s2.8-.7 4-2" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>

  <section x-show="available && open" @keydown.escape.window="closePanel" class="ai-chat-panel" :class="panelExpanded ? 'ai-chat-panel-expanded' : 'ai-chat-panel-collapsed'" role="dialog" aria-label="AI crash assistant">
    <header class="ai-chat-header">
      <div class="min-w-0">
        <h2 class="font-semibold text-sm">AI Crash Assistant</h2>
        <p class="text-xs text-gray-500 truncate">DeepSeek · <span x-text="selectedModelLabel()"></span> · read-only analysis</p>
      </div>
      <div class="flex items-center gap-1">
        <button type="button" class="ai-chat-icon-btn" @click="panelExpanded = !panelExpanded" :aria-expanded="String(panelExpanded)" :aria-label="panelExpanded ? 'Collapse chat' : 'Expand chat'">
          <span x-text="panelExpanded ? '−' : '+'"></span>
        </button>
        <button type="button" class="ai-chat-icon-btn" @click="openCrashPicker" aria-label="Attach crash">@</button>
        <button type="button" class="ai-chat-icon-btn" @click="newConversation" aria-label="New conversation">+</button>
        <button type="button" class="ai-chat-icon-btn" @click="closePanel" aria-label="Close chat">×</button>
      </div>
    </header>

    <div x-show="panelExpanded" class="ai-chat-body">
      <details class="ai-chat-options">
        <summary>Conversation and model</summary>
        <div class="ai-chat-toolbar">
          <select x-model="selectedId" @change="loadConversation" class="fc fc-sm flex-1" aria-label="Conversation">
            <option value="">New conversation</option>
            <template x-for="item in conversations" :key="item.id"><option :value="item.id" x-text="conversationLabel(item)"></option></template>
          </select>
          <button x-show="selectedId" @click="deleteConversation" type="button" class="text-xs text-red-400 hover:text-red-300">Delete</button>
        </div>
        <div class="ai-chat-toolbar">
          <label class="text-xs text-gray-500">Model
            <select x-model="model" class="fc fc-sm ml-1" aria-label="DeepSeek model">
              <template x-for="option in models" :key="option.value"><option :value="option.value" x-text="option.label"></option></template>
            </select>
          </label>
        </div>
      </details>

      <details class="ai-chat-options" :open="showCrashPicker">
        <summary>Crash context</summary>
        <div class="ai-chat-attachment">
          <div x-show="showCrashPicker" class="ai-chat-crash-picker mb-2 p-2 border border-gray-800 rounded-lg bg-surface-950">
            <div class="flex gap-2">
              <input x-model="crashSearch" @input.debounce.300ms="searchCrashes" class="fc fc-sm flex-1" placeholder="Search crashes by exception or message" aria-label="Search crashes">
              <button type="button" @click="showCrashPicker = false" class="text-xs text-gray-500">Close</button>
            </div>
            <div class="max-h-48 overflow-y-auto mt-2 space-y-1">
              <p x-show="crashLoading" class="text-xs text-gray-500 py-2">Loading crashes…</p>
              <template x-for="crash in crashes" :key="crash.id">
                <button type="button" @click="chooseCrash(crash)" class="w-full text-left p-2 rounded hover:bg-gray-800">
                  <span class="text-xs text-blue-300" x-text="'Crash #' + crash.id + (crash.project_name ? ' · ' + crash.project_name : '')"></span>
                  <span class="block text-xs text-gray-300 truncate" x-text="crash.exception_type + (crash.exception_message ? ': ' + crash.exception_message : '')"></span>
                  <span class="block text-[10px] text-gray-500" x-text="(crash.runtime || 'unknown runtime') + ' · ' + crash.total_count + ' occurrences · ' + crash.last_seen"></span>
                </button>
              </template>
              <p x-show="!crashLoading && crashes.length === 0" class="text-xs text-gray-600 py-2">No authorized crashes found.</p>
            </div>
          </div>
          <template x-if="conversation?.group_id">
            <p class="text-xs text-gray-300" x-text="'Group #' + conversation.group_id + (conversation.report_id ? ' · Report #' + conversation.report_id : '')"></p>
          </template>
          <template x-if="!conversation?.group_id"><p class="text-xs text-gray-600">Type @crash GROUP_ID followed by a question to attach a crash and request code-aware fix suggestions.</p></template>
        </div>
      </details>

      <div class="ai-chat-messages" x-ref="messages" aria-live="polite">
        <template x-if="messages.length === 0"><p class="text-xs text-gray-500 text-center py-8">Ask about an attached crash, its analysis, or a safe next step.</p></template>
        <template x-for="item in messages" :key="item.id">
          <div class="ai-chat-message" :class="item.role === 'user' ? 'ai-chat-user' : 'ai-chat-assistant'">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[10px] text-gray-500" x-text="item.role === 'user' ? 'You' : 'AI'"></span>
              <button x-show="item.role === 'assistant' && item.content" @click="copyMessage(item)" type="button" class="ai-chat-copy" aria-label="Copy response">
                <span x-text="copiedId === item.id ? 'Copied' : 'Copy'"></span>
              </button>
            </div>
            <details x-show="item.role === 'assistant' && item.reasoning" class="ai-chat-reasoning">
              <summary>Reasoning returned by DeepSeek</summary>
              <p class="whitespace-pre-wrap break-words text-xs text-gray-400 mt-2" x-text="item.reasoning"></p>
            </details>
            <template x-if="item.role === 'assistant'">
              <div class="ai-chat-markdown" x-markdown="item.content"></div>
            </template>
            <template x-if="item.role === 'user'">
              <p class="whitespace-pre-wrap break-words text-sm" x-text="item.content"></p>
            </template>
          </div>
        </template>
        <p x-show="sending" class="text-xs text-blue-400">Thinking…</p>
      </div>

      <p x-show="error" x-text="error" class="text-xs text-red-400 px-3 pb-2"></p>
      <p x-show="status" x-text="status" class="text-xs text-gray-400 px-3 pb-2"></p>
      <form @submit.prevent="sending ? stop() : send()" class="ai-chat-compose">
        <textarea x-model="draft" @input="handleDraftInput" @keydown.enter="if (!$event.shiftKey) { $event.preventDefault(); sending ? stop() : send(); }" :disabled="sending" class="fc flex-1 resize-none" rows="2" maxlength="10000" placeholder="Ask a question…" aria-label="Message"></textarea>
        <button type="submit" class="btn btn-sm self-end" :class="sending ? 'btn-red' : 'btn-blue'" :disabled="!sending && !draft.trim()" x-text="sending ? 'Stop' : 'Send'"></button>
      </form>
    </div>
  </section>
</div>
<script src="/web/static/js/markdown.js"></script>
<script src="/web/static/js/ai-chat.js"></script>
