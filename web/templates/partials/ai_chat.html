<div x-data="aiChat" x-cloak class="ai-chat-host">
  <button x-show="available && !open" @click="openPanel" type="button" class="ai-chat-launcher" aria-label="Open AI crash assistant">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 3a8 8 0 0 0-8 8v2a3 3 0 0 0 3 3h1v-5H5a7 7 0 0 1 14 0h-3v5h1a3 3 0 0 0 3-3v-2a8 8 0 0 0-8-8Z" stroke-width="1.5"/><path d="M8 19c1.2 1.3 2.5 2 4 2s2.8-.7 4-2" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>

  <section x-show="available && open" @keydown.escape.window="closePanel" @pointermove.window="resizePanel($event)" @pointerup.window="stopResize" class="ai-chat-panel" :class="panelExpanded ? 'ai-chat-panel-expanded' : 'ai-chat-panel-collapsed'" :style="panelExpanded ? `width: ${panelWidth}px; height: ${panelHeight}px` : ''" role="dialog" aria-label="AI crash assistant">
    <div class="ai-chat-resize-handle" @pointerdown="startResize($event)" aria-label="Resize chat panel" role="separator"></div>
    <header class="ai-chat-header">
      <div class="min-w-0">
        <h2 class="font-semibold text-sm">AI Crash Assistant</h2>
        <div class="ai-chat-header-meta">
          <span>DeepSeek · <span x-text="selectedModelLabel()"></span></span>
          <template x-if="conversation?.group_id"><span class="ai-chat-attachment-chip" x-text="'Crash Group #' + conversation.group_id + (conversation.report_id ? ' · Report #' + conversation.report_id : '')"></span></template>
          <template x-if="!conversation?.group_id"><span class="ai-chat-attachment-chip ai-chat-attachment-empty">No crash attached</span></template>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button type="button" class="ai-chat-icon-btn" @click="panelExpanded = !panelExpanded" :aria-expanded="String(panelExpanded)" :aria-label="panelExpanded ? 'Collapse chat' : 'Expand chat'"><span x-text="panelExpanded ? '−' : '+'"></span></button>
        <button type="button" class="ai-chat-icon-btn" @click="openCrashPicker" aria-label="Attach crash">@</button>
        <button type="button" class="ai-chat-icon-btn" @click="closePanel" aria-label="Close chat">×</button>
      </div>
    </header>

    <div x-show="panelExpanded" class="ai-chat-body">
      <aside class="ai-chat-history" aria-label="Conversation history">
        <div class="ai-chat-history-header"><span>History</span></div>
        <button type="button" class="ai-chat-history-new" @click="newConversation">New conversation</button>
        <div class="ai-chat-history-list">
          <template x-for="item in conversations" :key="item.id">
            <button type="button" class="ai-chat-history-item" :class="{'ai-chat-history-selected': selectedId === String(item.id)}" @click="selectedId = String(item.id); loadConversation()">
              <span x-text="conversationLabel(item)"></span>
            </button>
          </template>
        </div>
        <button x-show="selectedId" @click="deleteConversation" type="button" class="ai-chat-history-delete">Delete conversation</button>
      </aside>
      <main class="ai-chat-main">
      <details class="ai-chat-options">
        <summary>Model</summary>
        <div class="ai-chat-toolbar">
          <label class="text-xs text-gray-500">Model
            <select x-model="model" class="fc fc-sm ml-1" aria-label="DeepSeek model">
              <template x-for="option in models" :key="option.value"><option :value="option.value" x-text="option.label"></option></template>
            </select>
          </label>
          <label class="text-xs text-gray-500 flex items-center gap-2" :class="thinking ? 'text-blue-300' : ''">
            <span>Thinking</span>
            <button type="button" role="switch" :aria-checked="String(thinking)" aria-label="Enable thinking"
                    @click="thinking = !thinking"
                    class="relative inline-flex h-4 w-7 shrink-0 items-center rounded-full transition-colors"
                    :class="thinking ? 'bg-blue-600' : 'bg-gray-700'">
              <span class="inline-block h-3 w-3 transform rounded-full bg-white transition-transform"
                    :class="thinking ? 'translate-x-3.5' : 'translate-x-0.5'"></span>
            </button>
          </label>
        </div>
      </details>

      <div x-show="tasks.length > 0" class="ai-chat-tasks">
        <details class="ai-chat-tasks-details" :open="panelExpanded">
          <summary class="ai-chat-tasks-summary"><span>Agent tasks</span><span class="ai-chat-tasks-count" x-text="tasks.filter(task => task.status !== 'completed').length + '/' + tasks.length + ' open'"></span></summary>
          <ul class="ai-chat-tasks-list"><template x-for="task in tasks" :key="task.id"><li class="ai-chat-task" :class="'ai-chat-task-' + task.status" :title="task.notes || ''"><span class="ai-chat-task-dot" aria-hidden="true"></span><span class="ai-chat-task-title" x-text="task.title"></span><span class="ai-chat-task-status" x-text="task.status.replace('_', ' ')"></span></li></template></ul>
        </details>
      </div>

      <div class="ai-chat-messages" x-ref="messages" aria-live="polite">
        <template x-if="messages.length === 0"><p class="text-xs text-gray-500 text-center py-8">Ask about an attached crash, its analysis, or a safe next step.</p></template>
        <template x-for="item in messages" :key="item.id">
          <div class="ai-chat-message" :class="item.role === 'user' ? 'ai-chat-user' : 'ai-chat-assistant'">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[10px] text-gray-500" x-text="item.role === 'user' ? 'You' : 'AI'"></span>
              <button x-show="item.role === 'assistant' && item.content" @click="copyMessage(item)" type="button" class="ai-chat-copy" aria-label="Copy response">
                <span x-text="copiedId === item.id ? 'Copied' : 'Copy'"></span>
              </button>
            </div>
            <details x-show="item.role === 'assistant' && item.reasoning" class="ai-chat-reasoning">
              <summary>Reasoning returned by DeepSeek</summary>
              <p class="whitespace-pre-wrap break-words text-xs text-gray-400 mt-2" x-text="item.reasoning"></p>
            </details>
            <template x-if="item.role === 'assistant' && item.compact">
              <div class="ai-chat-compact" aria-live="polite">
                <template x-if="!item.compactDone">
                  <div>
                    <p class="ai-chat-compact-status"><span class="ai-chat-spinner" aria-hidden="true"></span>上下文正在压缩…</p>
                    <div class="ai-chat-compact-track" role="progressbar" :aria-valuenow="item.compactProgress || 5" aria-valuemin="0" aria-valuemax="100"><div class="ai-chat-compact-bar" :style="'width: ' + (item.compactProgress || 5) + '%'"></div></div>
                    <p class="text-[10px] text-gray-500 mt-1" x-text="(item.compactProgress || 5) + '%'"></p>
                  </div>
                </template>
                <template x-if="item.compactDone">
                  <div>
                    <p class="ai-chat-compact-status text-green-400"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4L19 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>上下文已压缩</p>
                    <div class="ai-chat-compact-track"><div class="ai-chat-compact-bar" style="width: 100%"></div></div>
                    <p class="text-[10px] text-gray-500 mt-1">100%</p>
                  </div>
                </template>
              </div>
            </template>
            <template x-if="item.role === 'assistant' && !item.compact">
              <div class="ai-chat-flow">
                <template x-for="(seg, segIndex) in messageSegments(item)" :key="item.id + ':' + segIndex">
                  <div class="ai-chat-seg">
                    <template x-if="seg.step">
                      <div class="ai-chat-step" :class="'ai-chat-step-' + seg.step.status" :style="seg.step.group ? 'margin-left: 14px' : ''">
                        <details class="ai-chat-step-details">
                          <summary class="ai-chat-step-summary" @click="openStep(seg.step)">
                            <span class="ai-chat-step-name" x-text="seg.step.name"></span>
                            <span class="ai-chat-step-status" x-text="stepStatusLabel(seg.step.status)"></span>
                            <span x-show="seg.step.count > 1" class="ai-chat-step-count" x-text="seg.step.count + ' events'"></span>
                            <span x-show="stepDuration(seg.step)" class="ai-chat-step-duration" x-text="stepDuration(seg.step)"></span>
                          </summary>
                          <div class="ai-chat-step-body">
                            <template x-for="child in seg.step.children" :key="child.id">
                              <button type="button" class="ai-chat-step-child" @click="openStep(child)">
                                <span class="ai-chat-step-name" x-text="child.name"></span>
                                <span class="ai-chat-step-status" x-text="stepStatusLabel(child.status)"></span>
                                <span x-show="stepDuration(child)" class="ai-chat-step-duration" x-text="stepDuration(child)"></span>
                              </button>
                            </template>
                            <p x-show="seg.step.args" class="ai-chat-step-detail" x-text="seg.step.args"></p>
                            <p x-show="seg.step.prompt" class="ai-chat-step-detail" x-text="seg.step.prompt"></p>
                            <p x-show="seg.step.summary" class="ai-chat-step-detail" x-text="seg.step.summary"></p>
                          </div>
                        </details>
                        <details x-show="seg.step.reasoning" class="ai-chat-reasoning">
                          <summary>Reasoning returned by DeepSeek</summary>
                          <p class="whitespace-pre-wrap break-words text-xs text-gray-400 mt-2" x-text="seg.step.reasoning"></p>
                        </details>
                      </div>
                    </template>
                    <template x-if="!seg.step && seg.text">
                      <ai-markdown class="ai-chat-markdown" :content="seg.text"></ai-markdown>
                    </template>
                  </div>
                </template>
              </div>
            </template>
            <template x-if="item.role === 'user'">
              <p class="whitespace-pre-wrap break-words text-sm" x-text="item.content"></p>
            </template>
          </div>
        </template>
        <p x-show="sending" class="text-xs text-blue-400">Thinking…</p>
      </div>

      <aside x-show="selectedStep" x-transition class="ai-chat-step-drawer" role="dialog" aria-label="Tool details" @keydown.escape="closeStep()">
        <div class="ai-chat-step-drawer-header"><strong x-text="selectedStep?.name"></strong><button type="button" class="ai-chat-icon-btn" @click="closeStep()" aria-label="Close tool details">×</button></div>
        <div class="ai-chat-step-drawer-meta"><span x-text="selectedStep ? stepStatusLabel(selectedStep.status) : ''"></span><span x-show="selectedStep && stepDuration(selectedStep)" x-text="selectedStep ? stepDuration(selectedStep) : ''"></span></div>
        <pre x-show="selectedStep?.args" class="ai-chat-step-detail" x-text="selectedStep?.args"></pre>
        <p x-show="selectedStep?.prompt" class="ai-chat-step-detail" x-text="selectedStep?.prompt"></p>
        <pre x-show="selectedStep?.summary" class="ai-chat-step-detail" x-text="selectedStep?.summary"></pre>
        <p x-show="selectedStep?.reasoning" class="ai-chat-step-detail" x-text="selectedStep?.reasoning"></p>
      </aside>
      <div x-show="showCrashPicker" class="ai-chat-crash-picker" role="dialog" aria-label="Crash picker">
        <div class="flex gap-2"><input x-model="crashSearch" @input.debounce.300ms="searchCrashes" class="fc fc-sm flex-1" placeholder="Search crashes by exception or message" aria-label="Search crashes"><button type="button" @click="showCrashPicker = false" class="text-xs text-gray-500">Close</button></div>
        <div class="ai-chat-crash-results"><p x-show="crashLoading" class="text-xs text-gray-500 py-2">Loading crashes…</p><template x-for="crash in crashes" :key="crash.id"><button type="button" @click="chooseCrash(crash)" class="ai-chat-crash-option"><span class="text-xs text-blue-300" x-text="'Crash #' + crash.id + (crash.project_name ? ' · ' + crash.project_name : '')"></span><span class="block text-xs text-gray-300 truncate" x-text="crash.exception_type + (crash.exception_message ? ': ' + crash.exception_message : '')"></span><span class="block text-[10px] text-gray-500" x-text="(crash.runtime || 'unknown runtime') + ' · ' + crash.total_count + ' occurrences · ' + crash.last_seen"></span></button></template><p x-show="!crashLoading && crashes.length === 0" class="text-xs text-gray-600 py-2">No authorized crashes found.</p></div>
      </div>
      <p x-show="error" x-text="error" class="text-xs text-red-400 px-3 pb-2"></p>
      <p x-show="status" x-text="status" class="text-xs text-gray-400 px-3 pb-2"></p>
      <form @submit.prevent="sending ? stop() : send()" class="ai-chat-compose">
        <div x-show="commandMenuOpen" x-transition class="ai-chat-command-menu" role="listbox" aria-label="Slash commands">
          <template x-for="(command, index) in filteredCommands()" :key="command.name">
            <button type="button" class="ai-chat-command" :class="index === commandIndex ? 'ai-chat-command-active' : ''" @mousedown.prevent="selectCommand(command)" role="option" :aria-selected="String(index === commandIndex)">
              <span class="ai-chat-command-name" x-text="command.name"></span>
              <span class="ai-chat-command-description" x-text="command.description"></span>
            </button>
          </template>
        </div>
        <textarea x-ref="composer" x-model="draft" @compositionstart="composing = true" @compositionend="composing = false; handleDraftInput()" @input="handleDraftInput" @keydown="handleComposerKeydown" :disabled="sending" class="fc flex-1 resize-none" rows="2" maxlength="10000" placeholder="Ask a question…" aria-label="Message"></textarea>
        <button type="submit" class="btn btn-sm self-end" :class="sending ? 'btn-red' : 'btn-blue'" :disabled="!sending && !draft.trim()" x-text="sending ? 'Stop' : 'Send'"></button>
      </form>
      </main>
    </div>
  </section>
</div>
<script src="/web/static/js/markdown.js"></script>
<script src="/web/static/js/ai-chat.js"></script>
